name: Break Time parser validation

on:
  push:
    branches:
      - feature/break-time-burger-wrap-parser
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install parser dependencies
        run: python -m pip install --upgrade pip requests beautifulsoup4

      - name: Compile Python files
        run: python -m compileall -q main.py parsers tests

      - name: Run test suite
        run: python -m unittest discover -s tests -p "test_*.py" -v

  live-site-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install parser dependencies
        run: python -m pip install --upgrade pip requests beautifulsoup4

      - name: Diagnose the live catalog HTML
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          from parsers.break_time import HEADERS, LANGUAGE_URLS, build_catalog_url, get_cards, get_name, get_price, _pagination_urls

          session = requests.Session()
          session.headers.update(HEADERS)
          for language in LANGUAGE_URLS:
              url = build_catalog_url(language)
              response = session.get(url, timeout=30)
              soup = BeautifulSoup(response.text, "html.parser")
              print(f"DIAG {language}: status={response.status_code}, final_url={response.url}, title={soup.title.get_text(strip=True) if soup.title else None}")
              for selector in ("ul.products li.product", ".products .product", "li.product", ".product", ".ee-post", "article", "a.page-numbers[href]"):
                  print(f"  selector {selector!r}: {len(soup.select(selector))}")
              cards = get_cards(soup)
              print(f"  get_cards={len(cards)}")
              for card in cards[:3]:
                  print(f"  sample: name={get_name(card)!r}, price={get_price(card)!r}, classes={card.get('class')}, id={card.get('id')!r}")
              print(f"  pagination={_pagination_urls(soup, response.url, language)[:8]}")
              print(f"  visible text={soup.get_text(' ', strip=True)[:500]}")
          PY

      - name: Parse live RU and ET menus without writing to Supabase
        run: |
          python - <<'PY'
          from parsers.break_time import parse_menu

          rows = parse_menu()
          print(f"SMOKE TEST: parsed {len(rows)} unique output rows")

          assert rows, "The live parser returned no rows."
          assert len(rows) >= 100, f"Suspiciously few menu rows: {len(rows)}"

          invalid = [
              row for row in rows
              if not row.get("dish_name")
              or row.get("price") is None
              or float(row["price"]) <= 0
              or not row.get("category_ru")
              or not row.get("category_et")
              or not row.get("product_type")
          ]
          assert not invalid, f"Rows are missing required fields: {invalid[:5]}"

          ru_names = sum(bool(row.get("dish_name_ru")) for row in rows)
          et_names = sum(bool(row.get("dish_name_et")) for row in rows)
          both_names = sum(
              bool(row.get("dish_name_ru") and row.get("dish_name_et"))
              for row in rows
          )
          print(f"Russian titles: {ru_names}; Estonian titles: {et_names}; paired: {both_names}")
          print("Live parser smoke test passed. Supabase was not contacted.")
          PY
