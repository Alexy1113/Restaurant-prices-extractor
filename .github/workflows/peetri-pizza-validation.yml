name: Peetri Pizza parser validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "parsers/peetri_pizza.py"
      - "parsers/categories.py"
      - "tests/test_peetri_pizza_parser.py"
      - "tests/test_categories.py"
      - ".github/workflows/peetri-pizza-validation.yml"
  push:
    branches:
      - feature/peetri-pizza-johvi
    paths:
      - "parsers/peetri_pizza.py"
      - "parsers/categories.py"
      - "tests/test_peetri_pizza_parser.py"
      - "tests/test_categories.py"
      - ".github/workflows/peetri-pizza-validation.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install parser dependencies
        run: python -m pip install --upgrade pip requests beautifulsoup4

      - name: Compile Peetri Pizza parser and tests
        run: python -m compileall -q parsers/peetri_pizza.py tests/test_peetri_pizza_parser.py tests/test_categories.py

      - name: Run Peetri Pizza parser tests
        run: python -m unittest discover -s tests -p "test_peetri_pizza_parser.py" -v

      - name: Run shared category tests
        run: python -m unittest discover -s tests -p "test_categories.py" -v

  # Trigger this job by pushing a commit containing [live-test].
# It reads the real public menu only and never writes to Supabase.
# A passing live smoke test confirms actual location-specific menu parsing.
  live-site-smoke-test:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[live-test]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install parser dependencies
        run: python -m pip install --upgrade pip requests beautifulsoup4

      - name: Parse live Jõhvi pizza menu without writing to Supabase
        run: |
          python - <<'PY'
          import json
          import requests
          from parsers.peetri_pizza import (
              MENU_URL, HEADERS, parse_menu, extract_initial_react_state
          )

          rows = parse_menu()
          print(f"LIVE SMOKE TEST: extracted {len(rows)} Peetri Pizza Jõhvi rows")

          session = requests.Session()
          session.headers.update(HEADERS)
          menu_response = session.get(MENU_URL, timeout=(8, 25))
          menu_response.raise_for_status()
          state = extract_initial_react_state(menu_response.text)
          products = state.get("productsData", {}).get("pizzas", []) if state else []
          print(f"MENU STATE: root keys={list(state) if state else []}")
          print(f"MENU URLS: {json.dumps(state.get('urls', {}) if state else {}, ensure_ascii=False)[:3500]}")
          products_data = state.get("productsData", {}) if state else {}
          print(f"PRODUCT GROUPS: {[(key, type(value).__name__, len(value) if isinstance(value, list) else None) for key, value in products_data.items()] if isinstance(products_data, dict) else type(products_data)}")
          for key, value in (products_data.items() if isinstance(products_data, dict) else []):
              if isinstance(value, list) and value:
                  print(f"GROUP {key} SAMPLE: {json.dumps(value[0], ensure_ascii=False)[:5000]}")
          print(f"PRODUCT CATEGORIES: {json.dumps(state.get('productCategories', []) if state else [], ensure_ascii=False)[:7000]}")
          if products:
              pizza = products[0]
              print(f"FIRST PIZZA KEYS: {list(pizza)}")
              print(f"FIRST PIZZA DATA: {json.dumps(pizza, ensure_ascii=False)[:3500]}")
              for field in ("urlAddNew", "urlQueue"):
                  detail_url = pizza.get(field)
                  if not detail_url:
                      continue
                  try:
                      detail_response = session.get(detail_url, timeout=(8, 25))
                      detail_state = extract_initial_react_state(detail_response.text)
                      print(f"DETAIL {field}: status={detail_response.status_code}; url={detail_response.url}; html={len(detail_response.text)}")
                      if detail_state:
                          print(f"DETAIL {field} ROOT: {list(detail_state)}")
                          print(f"DETAIL {field} STATE: {json.dumps(detail_state, ensure_ascii=False)[:10000]}")
                      else:
                          print(f"DETAIL {field} HAS NO initialReactState")
                  except requests.RequestException as error:
                      print(f"DETAIL {field} ERROR: {error}")

          assert rows, "The live Jõhvi page returned no pizza records."
          invalid = [
              row for row in rows
              if not row.get("dish_name")
              or not row.get("dish_code")
              or not row.get("product_type") == "pizzas"
              or not row.get("category_ru") == "Пицца"
              or not row.get("category_et") == "Pitsad"
              or float(row.get("price") or 0) <= 0
          ]
          assert not invalid, f"Invalid pizza records: {invalid[:5]}"

          print("Live menu smoke test passed. Supabase was not contacted.")
          PY

